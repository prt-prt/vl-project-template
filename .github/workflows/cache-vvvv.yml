name: Cache vvvv

on:
  workflow_dispatch:

env:
  # Set your project name here (must match your .vl and .props files)
  PROJECT_NAME: NewProject

  # vvvv gamma version to use for building
  # Find build IDs at https://vvvv.org/download/ (inspect download link)
  VVVV_VERSION: "7.0"
  VVVV_BUILD_ID: "39385"  # Build ID for win-x64

  # Installation paths (no need to change these)
  VVVV_INSTALL_DIR: "C:\\vvvv"
  COMPILER_PATH: "C:\\vvvv\\vvvvc.exe"
  VVVV_SETUP_PATH: "C:\\vvvv\\vvvv_setup.exe"

jobs:
  cache-vvvv:
    runs-on: windows-latest

    steps:
      - name: Restore vvvv cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.VVVV_INSTALL_DIR }}
            ${{ env.VVVV_SETUP_PATH }}
          key: vvvv-${{ runner.os }}-${{ env.VVVV_VERSION }}-${{ env.VVVV_BUILD_ID }}
          restore-keys: |
            vvvv-${{ runner.os }}-${{ env.VVVV_VERSION }}-
            vvvv-${{ runner.os }}-

      - name: Download vvvv gamma
        run: |
          $vvvvUrl = "https://teamcity.vvvv.org/guestAuth/app/rest/builds/id:${{ env.VVVV_BUILD_ID }}/artifacts/content/vvvv_gamma_${{ env.VVVV_VERSION }}-win-x64_setup.exe"
          Write-Host "Downloading vvvv gamma from: $vvvvUrl"
          New-Item -ItemType Directory -Path "${{ env.VVVV_INSTALL_DIR }}" -Force | Out-Null
          if (!(Test-Path "${{ env.VVVV_SETUP_PATH }}")) {
            Invoke-WebRequest -Uri $vvvvUrl -OutFile "${{ env.VVVV_SETUP_PATH }}"
          } else {
            Write-Host "Installer already cached at ${{ env.VVVV_SETUP_PATH }}"
          }
          Write-Host "Download complete, file size: $((Get-Item '${{ env.VVVV_SETUP_PATH }}').Length / 1MB) MB"

      - name: Install vvvv gamma
        run: |
          if (Test-Path "${{ env.COMPILER_PATH }}") {
            Write-Host "vvvv already installed at ${{ env.VVVV_INSTALL_DIR }}"
          } else {
            Write-Host "Installing vvvv gamma to ${{ env.VVVV_INSTALL_DIR }}..."
            Start-Process -Wait -FilePath "${{ env.VVVV_SETUP_PATH }}" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=${{ env.VVVV_INSTALL_DIR }}"
            Write-Host "Installation complete"
          }

          # Verify installation
          if (Test-Path "${{ env.COMPILER_PATH }}") {
            Write-Host "vvvvc.exe found at ${{ env.COMPILER_PATH }}"
          } else {
            Write-Host "ERROR: vvvvc.exe not found!"
            Get-ChildItem -Path "${{ env.VVVV_INSTALL_DIR }}" -Recurse -Filter "*.exe" | Select-Object FullName
            exit 1
          }

      - name: Save vvvv cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.VVVV_INSTALL_DIR }}
            ${{ env.VVVV_SETUP_PATH }}
          key: vvvv-${{ runner.os }}-${{ env.VVVV_VERSION }}-${{ env.VVVV_BUILD_ID }}
